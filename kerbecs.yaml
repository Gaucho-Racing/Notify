gateway:
  name: notify-gateway
  version: 0.1.0
  env: ${ENV:DEV}
  timeouts:
    dial: 5s
    headers: 30s
    idle: 50s
    overall: 0

listeners:
  gateway:
    port: "10310"
    cors:
      enabled: true
      allowed_origins: ["*"]
      allow_credentials: false
  admin:
    port: "10300"
    auth:
      type: basic
      username: ${KERBECS_USER:admin}
      password: ${KERBECS_PASSWORD:admin}

providers:
  static:
    watch: false

upstreams:
  notify:
    name: notify
    version: 0.1.0
    instances:
      - http://notify:9999

routes:
  - name: notify-api
    match:
      path: /api/*
    upstream: notify
    rewrite:
      strip_prefix: /api
    envelope: passthrough


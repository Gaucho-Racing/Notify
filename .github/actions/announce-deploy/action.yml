name: Announce deploy
description: Posts a deploy request to a Discord channel through Notify, pinging the person who started it.

inputs:
  token:
    description: Sentinel service account token with access to Notify and the user:read scope.
    required: true
  channel-id:
    description: Discord channel to post in.
    required: true
  service:
    description: Name of the service being deployed.
    required: true
  version:
    description: Version being deployed.
    required: false
    default: ""
  pr-url:
    description: Link to the pull request that performs the deploy.
    required: true
  github-user-id:
    description: Numeric GitHub user ID of the person deploying, used to find their Discord account in Sentinel.
    required: true
  github-login:
    description: GitHub username shown when the person has no linked Discord account.
    required: true
  notify-url:
    required: false
    default: https://notify.gauchoracing.com/api
  sentinel-url:
    required: false
    default: https://sso.gauchoracing.com/api

runs:
  using: composite
  steps:
    - shell: bash
      run: "$GITHUB_ACTION_PATH/announce.sh"
      env:
        TOKEN: ${{ inputs.token }}
        CHANNEL_ID: ${{ inputs.channel-id }}
        SERVICE: ${{ inputs.service }}
        VERSION: ${{ inputs.version }}
        PR_URL: ${{ inputs.pr-url }}
        GITHUB_USER_ID: ${{ inputs.github-user-id }}
        GITHUB_LOGIN: ${{ inputs.github-login }}
        NOTIFY_URL: ${{ inputs.notify-url }}
        SENTINEL_URL: ${{ inputs.sentinel-url }}
